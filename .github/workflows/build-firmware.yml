# RTL9617C OpenWrt 固件自动编译
#
# 使用方法：
#   1. 将本文件放到 rtl9617c-openwrt 仓库根目录的 .github/workflows/ 下
#   2. 在 GitHub 仓库的 Actions 页面手动运行 "Build RTL9617C OpenWrt Firmware"
#   3. 软件包在 config/firmware-packages.config 中增删，或在触发时填写 extra_packages
#
# 行为约定：
#   - 目标：rtl9617c / generic
#   - LuCI 主题：仅 luci-theme-bootstrap（工作流会移除设备 profile 中硬编码的 argon）
#   - 必备组件：luci-proto-wireguard、wireguard-tools、kmod-wireguard
#   - 设备专属的 PON 控制等 DEVICE_PACKAGES 保持原样，固件才能正常使用

name: Build RTL9617C OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备"
        required: true
        default: "tianyi_tyfza1_2p5g"
        type: choice
        options:
          - tianyi_tyfza1_2p5g
          - youhua_pt1500_h10_2p5g
      extra_packages:
        description: "额外软件包（空格分隔，例如：luci-app-upnp htop curl）"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Release 标签（留空则只上传 Actions 产物）"
        required: false
        default: ""
        type: string
  push:
    branches:
      - refactor
    paths:
      - "config/firmware-packages.config"
      - "target/linux/rtl9617c/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

concurrency:
  group: rtl9617c-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: ${{ inputs.device || 'tianyi_tyfza1_2p5g' }}
  TARGET_DIR: bin/targets/rtl9617c/generic

jobs:
  build:
    name: Build ${{ inputs.device || 'tianyi_tyfza1_2p5g' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force || true
          df -h .

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            python3-pyelftools rsync unzip wget zlib1g-dev file xz-utils \
            qemu-utils uuid-dev
          python3 --version
          gcc --version | head -1

      - name: 更新并安装 feeds
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "feeds 更新失败，第 $((i + 1)) 次重试..."
            sleep 10
          done
          ./scripts/feeds install -a

      - name: 锁定 LuCI 主题为 bootstrap
        run: |
          set -euo pipefail
          # 设备 profile 默认硬编码 luci-theme-argon；这里统一替换成 bootstrap，
          # 其余主题在 config/firmware-packages.config 中显式关闭。
          sed -i 's/luci-theme-argon/luci-theme-bootstrap/g' \
            target/linux/rtl9617c/image/Makefile
          grep -n 'DEVICE_PACKAGES' target/linux/rtl9617c/image/Makefile

      - name: 生成 .config
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          {
            echo "CONFIG_TARGET_rtl9617c=y"
            echo "CONFIG_TARGET_rtl9617c_generic=y"
            echo "CONFIG_TARGET_DEVICE_rtl9617c_generic_DEVICE_${DEVICE}=y"
          } > .config
          cat config/firmware-packages.config >> .config
          if [ -n "${EXTRA_PACKAGES:-}" ]; then
            for pkg in $EXTRA_PACKAGES; do
              pkg="${pkg#+}"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            done
          fi
          make defconfig
          echo "----- 关键配置检查 -----"
          grep -E '^CONFIG_(TARGET_DEVICE_rtl9617c|PACKAGE_luci-theme|PACKAGE_luci-proto-wireguard|PACKAGE_wireguard-tools|PACKAGE_kmod-wireguard)' .config

      - name: 最终锁定主题与 WireGuard 配置
        run: |
          set -euo pipefail
          # defconfig 可能按 DEVICE_PACKAGES 的默认值把 argon 重新打开，这里再强制关闭一次
          ./scripts/config \
            -e PACKAGE_luci-theme-bootstrap \
            -e PACKAGE_luci-proto-wireguard \
            -e PACKAGE_wireguard-tools \
            -e PACKAGE_kmod-wireguard \
            -d PACKAGE_luci-theme-argon \
            -d PACKAGE_luci-theme-material \
            -d PACKAGE_luci-theme-design \
            -d PACKAGE_luci-theme-openwrt
          grep -E '^CONFIG_PACKAGE_(luci-theme|luci-proto-wireguard|wireguard-tools|kmod-wireguard)' .config

      - name: 预下载源码包
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if make -j"$(nproc)" download; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "下载失败，第 $((i + 1)) 次重试..."
            sleep 10
          done

      - name: 编译固件
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "并行编译失败，改用单线程输出详细信息重试..."
            make -j1 V=s
          fi

      - name: 收集固件产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$TARGET_DIR" -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'sha256sums' -o -name '*.manifest' \) \
            -exec cp {} artifacts/ \;
          cp .config artifacts/firmware.config
          cp config/firmware-packages.config artifacts/packages.config
          ls -lh artifacts

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: rtl9617c-${{ env.DEVICE }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: artifacts/*

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "### RTL9617C 固件构建"
            echo ""
            echo "- 设备：\`${DEVICE}\`"
            echo "- LuCI 主题：\`luci-theme-bootstrap\`"
            echo "- WireGuard：\`luci-proto-wireguard\` + \`wireguard-tools\` + \`kmod-wireguard\`"
            echo "- 软件包配置来源：\`config/firmware-packages.config\`"
            echo ""
            echo "产物列表："
            echo '```'
            ls -1 artifacts 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
