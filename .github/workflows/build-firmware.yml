# RTL9617C OpenWrt 固件自动编译
#
# 使用方法：
#   1. 把本文件和 config/firmware-packages.config 放到一个 GitHub 仓库（称为"配置仓库"）
#   2. 在该仓库 Actions 页面手动运行 "Build RTL9617C OpenWrt Firmware"
#   3. source_repo / source_ref 可指定任意 OpenWrt 源码仓库和分支（默认 lyq1996/rtl9617c-openwrt@refactor）
#   4. 仅手动触发（workflow_dispatch），push / 定时等事件不会启动编译
#
# 行为约定：
#   - 源码：由 source_repo + source_ref 决定，检出到 source/ 目录
#   - 配置：始终从"运行工作流的仓库"读取 config/firmware-packages.config
#   - 目标：rtl9617c / generic（设备由 device 参数选择）
#   - LuCI 主题：仅 luci-theme-bootstrap（工作流会移除设备 profile 中硬编码的 argon）
#   - 必备组件：luci-proto-wireguard、wireguard-tools、kmod-wireguard
#   - 设备专属的 PON 控制等 DEVICE_PACKAGES 保持原样，固件才能正常使用
#   - PON 控制包含 Rust 组件，工作流会安装 aarch64-unknown-linux-musl 交叉目标

name: Build RTL9617C OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "OpenWrt 源码仓库（owner/repo，也支持 GitHub URL；默认 lyq1996/rtl9617c-openwrt）"
        required: false
        default: "lyq1996/rtl9617c-openwrt"
        type: string
      source_ref:
        description: "源码分支 / 标签 / 提交（留空用该仓库默认分支，默认 refactor）"
        required: false
        default: "refactor"
        type: string
      device:
        description: "目标设备"
        required: true
        default: "tianyi_tyfza1_2p5g"
        type: choice
        options:
          - tianyi_tyfza1_2p5g
          - youhua_pt1500_h10_2p5g
      extra_packages:
        description: "额外软件包（空格分隔，例如：luci-app-upnp htop curl）"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Release 标签（留空则只上传 Actions 产物）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  DEVICE: ${{ inputs.device || 'tianyi_tyfza1_2p5g' }}
  TARGET_DIR: bin/targets/rtl9617c/generic

jobs:
  build:
    name: Build ${{ inputs.device || 'tianyi_tyfza1_2p5g' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 解析源码仓库地址
        id: repo
        env:
          INPUT_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail
          repo="$INPUT_REPO"
          [ -n "$repo" ] || repo="lyq1996/rtl9617c-openwrt"
          case "$repo" in
            https://*|http://*|git://*)
              repo="${repo#*://}"
              repo="${repo#*/}"
              repo="${repo%.git}"
              ;;
            git@*:*)
              repo="${repo#*:}"
              repo="${repo%.git}"
              ;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "源码仓库: $repo"
          echo "源码引用: ${{ inputs.source_ref || '(默认分支)' }}"

      - name: 检出构建配置（当前仓库）
        uses: actions/checkout@v4
        with:
          path: build-config
          fetch-depth: 1
          sparse-checkout: |
            config
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: 检出 OpenWrt 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repo }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1

      - name: 准备软件包配置
        run: |
          set -euo pipefail
          if [ -f build-config/config/firmware-packages.config ]; then
            cp -f build-config/config/firmware-packages.config source/config/firmware-packages.config
            echo "使用配置仓库中的 config/firmware-packages.config"
          elif [ -f source/config/firmware-packages.config ]; then
            echo "配置文件不在配置仓库中，使用源码仓库自带的 config/firmware-packages.config"
          else
            echo "错误：找不到 config/firmware-packages.config" >&2
            exit 1
          fi

      - name: 释放 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force || true
          df -h .

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            python3-pyelftools rsync unzip wget zlib1g-dev file xz-utils \
            qemu-utils uuid-dev
          python3 --version
          gcc --version | head -1

      - name: 安装 Rust 交叉编译目标
        run: |
          set -euo pipefail
          # rtl9617c-pon-control 的 OMCI 组件用 cargo 交叉编译到 aarch64-unknown-linux-musl，
          # GitHub Runner 预装 rustup，但默认没有装 musl 目标，需要显式添加。
          if [ -x "$HOME/.cargo/bin/rustup" ]; then
            RUSTUP="$HOME/.cargo/bin/rustup"
          elif command -v rustup >/dev/null 2>&1; then
            RUSTUP=rustup
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            RUSTUP="$HOME/.cargo/bin/rustup"
          fi
          "$RUSTUP" target add aarch64-unknown-linux-musl
          "$RUSTUP" target list --installed
          "$HOME/.cargo/bin/rustc" --version

      - name: 更新并安装 feeds
        working-directory: source
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "feeds 更新失败，第 $((i + 1)) 次重试..."
            sleep 10
          done
          ./scripts/feeds install -a

      - name: 锁定 LuCI 主题为 bootstrap
        working-directory: source
        run: |
          set -euo pipefail
          # 设备 profile 默认硬编码 luci-theme-argon；这里统一替换成 bootstrap，
          # 其余主题在 config/firmware-packages.config 中显式关闭。
          sed -i 's/luci-theme-argon/luci-theme-bootstrap/g' \
            target/linux/rtl9617c/image/Makefile
          grep -n 'DEVICE_PACKAGES' target/linux/rtl9617c/image/Makefile

      - name: 生成 .config
        working-directory: source
        env:
          DEVICE: ${{ inputs.device || 'tianyi_tyfza1_2p5g' }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          echo "参数中的设备：${DEVICE}"

          # 第一步：写入目标板 + 软件包，先做一次 defconfig 生成完整的 Kconfig 定义，
          # 这样可以从 tmp/.config-target.in 中读出本版本真实的设备符号名。
          {
            echo "CONFIG_TARGET_rtl9617c=y"
            echo "CONFIG_TARGET_rtl9617c_generic=y"
          } > .config
          cat config/firmware-packages.config >> .config
          if [ -n "${EXTRA_PACKAGES:-}" ]; then
            for pkg in $EXTRA_PACKAGES; do
              pkg="${pkg#+}"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            done
          fi
          make defconfig

          # 第二步：从生成的配置里找出指向目标设备的 profile 符号（形如
          # CONFIG_TARGET_..._DEVICE_<设备名>=y 或 ... is not set）。
          # OpenWrt 各版本符号前缀不同，这里不硬编码，直接按 <设备名> 匹配。
          echo "----- 源码中的设备 profile 符号 -----"
          grep -E 'CONFIG_TARGET_.*DEVICE_.*(tianyi|youhua)' .config || true
          target_sym=$(grep -oE 'CONFIG_TARGET_[A-Za-z0-9_]*DEVICE_'"${DEVICE}"'=y' .config | head -1 || true)
          if [ -z "$target_sym" ]; then
            # 当前设备还是 "is not set" 形式，从注释行提取符号名
            target_sym=$(grep -oE '# CONFIG_TARGET_[A-Za-z0-9_]*DEVICE_'"${DEVICE}"' is not set' .config \
                         | head -1 | sed -E 's/^# (.*) is not set$/\1/' || true)
          fi
          if [ -z "$target_sym" ]; then
            echo "错误：源码中找不到设备 ${DEVICE} 的 profile 符号，请检查 device 参数或源码版本" >&2
            grep -E 'DEVICE_' .config >&2 || true
            exit 1
          fi
          target_sym="${target_sym%=y}"

          # 第三步：显式只选中目标设备，关闭另一个设备（避免 defconfig 回落到默认 youhua）。
          # 设备符号可能是 =y 或 "is not set" 两种形式，都转成 is not set 后再打开目标。
          for sym in $(grep -oE 'CONFIG_TARGET_[A-Za-z0-9_]*DEVICE_(tianyi_tyfza1_2p5g|youhua_pt1500_h10_2p5g)' .config | sort -u); do
            sed -i -E "s/^${sym}=y$/# ${sym} is not set/" .config
            sed -i -E "s/^# ${sym} is not set$/# ${sym} is not set/" .config
          done
          sed -i -E "s/^# ${target_sym} is not set$/${target_sym}=y/" .config
          grep -q "^${target_sym}=y$" .config || echo "${target_sym}=y" >> .config
          make defconfig

          echo "----- 关键配置检查 -----"
          grep -E '^CONFIG_(TARGET_.*DEVICE_.*=y|PACKAGE_luci-theme|PACKAGE_luci-proto-wireguard|PACKAGE_wireguard-tools|PACKAGE_kmod-wireguard)' .config || true
          echo "----- 设备选择校验 -----"
          selected=$(grep -c '^CONFIG_TARGET_.*DEVICE_.*=y' .config || true)
          if [ "$selected" -ne 1 ] || ! grep -q "^${target_sym}=y$" .config; then
            echo "错误：期望只选中 ${DEVICE}（${target_sym}），实际选中 ${selected} 个设备" >&2
            grep -E 'CONFIG_TARGET_.*DEVICE_' .config >&2 || true
            exit 1
          fi
          echo "已确认目标设备：${DEVICE}（${target_sym}=y）"

      - name: 最终锁定主题与 WireGuard 配置
        working-directory: source
        run: |
          set -euo pipefail
          # OpenWrt 的 scripts/config 是 kconfig 工具源码目录，不是可执行文件。
          # defconfig 可能按 DEVICE_PACKAGES 默认值重新打开 argon，这里直接改写 .config。
          for sym in \
            PACKAGE_luci-theme-bootstrap PACKAGE_luci-proto-wireguard \
            PACKAGE_wireguard-tools PACKAGE_kmod-wireguard \
            PACKAGE_luci-theme-argon PACKAGE_luci-theme-material \
            PACKAGE_luci-theme-design PACKAGE_luci-theme-openwrt; do
            sed -i -E "/^(# )?CONFIG_${sym}(=.*| is not set)$/d" .config
          done
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          # CONFIG_PACKAGE_luci-theme-argon is not set
          # CONFIG_PACKAGE_luci-theme-material is not set
          # CONFIG_PACKAGE_luci-theme-design is not set
          # CONFIG_PACKAGE_luci-theme-openwrt is not set
          EOF
          grep -E '^CONFIG_PACKAGE_(luci-theme|luci-proto-wireguard|wireguard-tools|kmod-wireguard)' .config

      - name: 预下载源码包
        working-directory: source
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if make -j"$(nproc)" download; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "下载失败，第 $((i + 1)) 次重试..."
            sleep 10
          done

      - name: 编译固件
        working-directory: source
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "并行编译失败，改用单线程输出详细信息重试..."
            make -j1 V=s
          fi

      - name: 收集固件产物
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$TARGET_DIR" -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'sha256sums' -o -name '*.manifest' \) \
            -exec cp {} artifacts/ \;
          cp .config artifacts/firmware.config
          cp config/firmware-packages.config artifacts/packages.config
          ls -lh artifacts

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: rtl9617c-${{ env.DEVICE }}
          path: source/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: source/artifacts/*

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "### RTL9617C 固件构建"
            echo ""
            echo "- 源码仓库：\`${{ steps.repo.outputs.repo }}@${{ inputs.source_ref || '默认分支' }}\`"
            echo "- 设备：\`${DEVICE}\`"
            echo "- LuCI 主题：\`luci-theme-bootstrap\`"
            echo "- WireGuard：\`luci-proto-wireguard\` + \`wireguard-tools\` + \`kmod-wireguard\`"
            echo "- 软件包配置来源：\`config/firmware-packages.config\`（运行工作流的仓库）"
            echo ""
            echo "产物列表："
            echo '```'
            ls -1 source/artifacts 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
